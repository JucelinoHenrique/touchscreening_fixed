plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// O bloco android {} começa aqui
android {
    namespace "com.example.touchscreening_fixed"
    // O Flutter gerencia a versão do compileSdk, mas 34 é um valor seguro e moderno.
    compileSdk 34
    ndkVersion flutter.ndkVersion

    // CORREÇÃO: Bloco que lê as propriedades do Flutter (versão, etc.) movido para dentro do android {}
    // Este é um local seguro que não interfere com a ordem do bloco de plugins.
    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withReader('UTF-8') { reader ->
            localProperties.load(reader)
        }
    }

    def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
    if (flutterVersionCode == null) {
        flutterVersionCode = '1'
    }

    def flutterVersionName = localProperties.getProperty('flutter.versionName')
    if (flutterVersionName == null) {
        flutterVersionName = '1.0'
    }

    compileOptions {
        // CORREÇÃO: Revertido para a versão 1.8 do Java, que é compatível com seu Gradle.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.example.touchscreening_fixed"
        minSdkVersion 23
        targetSdkVersion 34 
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

// A seção 'flutter' é movida para o final do arquivo
flutter {
    source = "../.."
}

dependencies {
    // Adicione dependências específicas do Android aqui, se necessário.
}

